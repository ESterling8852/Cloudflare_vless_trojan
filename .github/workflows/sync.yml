name: Auto Pull Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream
        uses: areshack/pull-upstream-action@v1.1.0
        with:
          upstream_repo: "https://github.com/yonggekkk/Cloudflare-vless-trojan.git"
          upstream_branch: "main"
          downstream_branch: "main"
          token: ${{ secrets.GITHUB_TOKEN }}
